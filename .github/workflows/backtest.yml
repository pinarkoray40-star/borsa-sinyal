name: Backtest çalıştır

on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python download_data.py
      - run: python backtest.py
      - name: Sonucu repo'ya kaydet ve siteyi yenile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add backtest.json
          git diff --staged --quiet || git commit -m "Backtest sonuçlarını güncelle"
          git push
          gh workflow run signals.yml
