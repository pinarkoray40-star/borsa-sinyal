name: KAP bedelsiz kesif
on:
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: KAP bedelsiz duyuru kesfi
        run: python kap_bedelsiz_probe.py
      - name: Sonucu sakla
        uses: actions/upload-artifact@v4
        with:
          name: kap-bedelsiz-kesif
          path: kap_bedelsiz_probe.md
          if-no-files-found: ignore
