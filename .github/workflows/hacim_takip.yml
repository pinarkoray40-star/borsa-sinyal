name: Hacim takip
on:
  workflow_dispatch:
  schedule:
    - cron: "45 15 * * 1-5"
permissions:
  contents: write
concurrency:
  group: hacim-takip
  cancel-in-progress: false
jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install borsapy pandas numpy
      - run: python takip.py
      - name: Kayitlari repoya yaz
        run: |
          git config user.name "hacim-takip-bot"
          git config user.email "hacim-takip-bot@users.noreply.github.com"
          git add takip_pozisyon.csv takip_gunluk.csv
          git diff --staged --quiet || git commit -m "Hacim takip guncellemesi"
          git push
