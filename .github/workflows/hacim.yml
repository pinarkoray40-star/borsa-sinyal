name: Hacim birikim
on: workflow_dispatch
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install borsapy pandas
      - run: python hacim_birikim.py
      - uses: actions/upload-artifact@v4
        with:
          name: hacim-sonuc
          path: hacim_birikim_sonuc.csv
