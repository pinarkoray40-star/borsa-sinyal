name: Bilanco topla

on:
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install requests yfinance pandas numpy

      - name: Bilancolari topla
        run: python bilanco_topla.py

      - name: Veriyi kaydet
        uses: actions/upload-artifact@v4
        with:
          name: bilanco-veri
          path: |
            bilanco.csv.gz
            kalemler.csv
          retention-days: 30
