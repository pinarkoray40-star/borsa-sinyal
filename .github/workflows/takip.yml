name: Takip defteri

on:
  schedule:
    - cron: "0 16 * * 1-5" # 19:00 TR, seans kapanışından sonra
  workflow_dispatch: # elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tarayici.py
      - name: Defteri kaydet
        run: |
          git config user.name "takip-bot"
          git config user.email "takip-bot@users.noreply.github.com"
          git add takip
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Takip defteri: $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
