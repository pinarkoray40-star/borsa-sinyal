name: Buyuk yukselis analizi
on:
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paketleri kur
        run: pip install borsapy pandas numpy
      - name: Buyuk yukselis analizi
        run: python buyuk_yukselis_analiz.py
      - name: Sonucu sakla
        uses: actions/upload-artifact@v4
        with:
          name: buyuk-yukselis-sonuc
          path: buyuk_yukselis_olaylar.csv
