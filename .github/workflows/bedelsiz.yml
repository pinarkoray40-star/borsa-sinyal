name: Bedelsiz testi

on:
  workflow_dispatch:

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install borsapy pandas

      - name: Tani calistir
        run: python tani.py
