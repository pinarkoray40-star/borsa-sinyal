name: Bedelsiz testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install borsapy pandas numpy

      - name: Bedelsiz testi calistir
        run: python bedelsiz_test.py

      - name: Sonuclari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedelsiz-sonuc
          path: |
            bedelsiz_olaylar.csv
            bedelsiz_rapor.txt
