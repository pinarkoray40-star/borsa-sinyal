name: Bedelsiz testi

on:
  workflow_dispatch: # elle calistirma butonu

permissions:
  contents: write

jobs:
  bedelsiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt borsapy
      - run: python bedelsiz_test.py
      - name: Sonucu kaydet
        run: |
          git config user.name "analiz-bot"
          git config user.email "analiz-bot@users.noreply.github.com"
          git add bedelsiz_olaylar.csv bedelsiz_rapor.txt
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Bedelsiz testi sonucu"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
