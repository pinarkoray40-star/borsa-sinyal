name: Bedelsiz testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install borsapy pandas numpy

      - name: Birlesim testi calistir
        run: python birlesim.py

      - name: Sonuclari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birlesim-sonuc
          path: |
            birlesim_satirlar.csv
            birlesim_rapor.txt
