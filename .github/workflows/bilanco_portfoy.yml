name: Bilanco portfoy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install yfinance pandas numpy requests

      - name: Son bilanco verisini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow "Bilanco topla" --status success --limit 1 --json databaseId --jq '.[0].databaseId' --repo "$GITHUB_REPOSITORY")
          echo "run: $RUN_ID"
          gh run download "$RUN_ID" -n bilanco-veri --repo "$GITHUB_REPOSITORY"
          ls -la

      - name: Bilanco portfoyunu calistir
        run: python bilanco_portfoy.py
