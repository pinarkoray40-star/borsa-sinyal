name: Hacim backtest C
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install borsapy pandas numpy
      - run: python hacim_backtest_c.py
      - uses: actions/upload-artifact@v4
        with:
          name: hacim-backtest-c
          path: hacim_backtest_c_sonuc.csv
