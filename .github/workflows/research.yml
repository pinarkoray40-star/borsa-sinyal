name: Strateji arastirmasi

on:
  workflow_dispatch: # elle calistirma butonu

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python research.py --period 5y
