name: Kazanan analizi

on:
  workflow_dispatch: # elle calistirma butonu

jobs:
  winners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python winners.py --period 5y
