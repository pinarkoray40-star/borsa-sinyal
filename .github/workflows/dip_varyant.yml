name: Dip OBV sart testi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python dip_varyant.py
      - uses: actions/upload-artifact@v4
        with:
          name: dip-varyant-sonuc
          path: dip_varyant_sonuc.csv
