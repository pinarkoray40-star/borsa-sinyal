name: KAP bedelsiz haber testi
on:
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paketleri kur
        run: pip install borsapy pandas numpy requests
      - name: KAP bedelsiz kayitlarini topla
        run: python kap_bedelsiz_topla.py --bas 2023-11-01 --sure-dk 45
      - name: Haber gunu testi
        run: python kap_bedelsiz_test.py
      - name: Sonuclari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kap-bedelsiz-sonuc
          path: |
            kap_bedelsiz_kayit.csv
            kap_bedelsiz_rapor.txt
            kap_bedelsiz_donguler.csv
            kap_bedelsiz_bekleyen.csv
          if-no-files-found: ignore
