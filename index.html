<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borsa Sinyal</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14181f; --muted: #667085; --line: #e4e7ec;
    --buy: #0a8f5b; --buy-bg: #e3f6ed; --sell: #d02b3a; --sell-bg: #fde8ea;
    --hold: #6b7280; --hold-bg: #eef0f3; --accent: #2f5bea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --text: #e8ebf0; --muted: #8b94a3; --line: #262c36;
      --buy: #3ddc97; --buy-bg: #12301f; --sell: #ff6b78; --sell-bg: #3a161b;
      --hold: #9aa3b2; --hold-bg: #232831; --accent: #7b9bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .updated { color: var(--muted); font-size: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filters button { border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .sym { font-size: 18px; font-weight: 700; }
  .badge { font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
  .AL { color: var(--buy); background: var(--buy-bg); }
  .SAT { color: var(--sell); background: var(--sell-bg); }
  .BEKLE, .VERİ { color: var(--hold); background: var(--hold-bg); }
  .price { margin-top: 10px; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chg { font-size: 14px; font-weight: 600; margin-left: 6px; }
  .up { color: var(--buy); } .down { color: var(--sell); }
  svg.spark { width: 100%; height: 52px; margin: 8px 0; display: block; }
  .why { color: var(--muted); font-size: 14px; margin: 0; }
  .rsi { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .msg { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Borsa Sinyal</h1>
    <div class="updated"><span id="updated"></span> · <a href="backtest.html" style="color:var(--accent)">Backtest</a></div>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Sinyal filtresi"></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">Yükleniyor…</div>
  <footer>RSI, MACD ve SMA20/50 kesişimine dayalı otomatik sinyaller. Borsa saatlerinde yaklaşık 15 dakikada bir güncellenir; Yahoo Finance verisi ~15 dk gecikmelidir. Gün içinde mum henüz kapanmadığı için sinyaller değişebilir. Yatırım tavsiyesi değildir.</footer>
</div>
<script>
const FILTERS = ["Hepsi", "AL", "SAT", "BEKLE"];
let items = [], active = "Hepsi";

const fmt = n => n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function spark(values, up) {
  if (!values || values.length < 2) return "";
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * 200).toFixed(1)},${(46 - (v - min) / span * 42).toFixed(1)}`).join(" ");
  const color = up ? "var(--buy)" : "var(--sell)";
  return `<svg class="spark" viewBox="0 0 200 50" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function card(it) {
  const sig = it.signal.split(" ")[0];
  const up = (it.change_pct ?? 0) >= 0;
  const first = it.spark?.[0], last = it.spark?.[it.spark.length - 1];
  const why = it.reasons?.length ? it.reasons.join("; ") : "Belirgin sinyal yok";
  return `<article class="card">
    <div class="top"><span class="sym">${it.symbol}</span><span class="badge ${sig}">${it.signal}</span></div>
    <div class="price">${it.price != null ? fmt(it.price) : "-"}
      <span class="chg ${up ? "up" : "down"}">${it.change_pct != null ? (up ? "+" : "") + fmt(it.change_pct) + "%" : ""}</span></div>
    ${spark(it.spark, last >= first)}
    <p class="why">${why}</p>
    ${it.rsi != null ? `<div class="rsi">RSI ${it.rsi.toFixed(1)}</div>` : ""}
  </article>`;
}

function render() {
  const list = items
    .filter(i => active === "Hepsi" || i.signal === active)
    .sort((a, b) => Math.abs(b.score) - Math.abs(a.score));
  document.getElementById("grid").innerHTML = list.map(card).join("");
  const msg = document.getElementById("msg");
  msg.style.display = list.length ? "none" : "block";
  msg.textContent = "Bu filtrede hisse yok.";
  document.getElementById("filters").innerHTML = FILTERS.map(f =>
    `<button aria-pressed="${f === active}" data-f="${f}">${f}${f === "Hepsi" ? "" : " (" + items.filter(i => i.signal === f).length + ")"}</button>`).join("");
}

document.getElementById("filters").addEventListener("click", e => {
  const f = e.target.dataset.f;
  if (f) { active = f; render(); }
});

function load() {
  return fetch("signals.json", { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      items = d.items;
      document.getElementById("updated").textContent = "Güncelleme: " +
        new Date(d.updated).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" });
      render();
    })
    .catch(() => { if (!items.length) document.getElementById("msg").textContent = "Veri yüklenemedi. Önce signals.py çalıştırılmalı."; });
}
load();
setInterval(load, 5 * 60 * 1000); // sayfa açık kalırsa 5 dakikada bir yenile
</script>
</body>
</html>
