name: Kazanan analiz
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install borsapy pandas numpy
      - run: python kazanan_analiz.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kazanan-analiz-sonuc
          path: kazanan_analiz_sonuc.csv
          if-no-files-found: ignore
